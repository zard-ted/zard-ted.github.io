<script>
  // 各個別ページのメインタイトルを自動でヘンリー部分（h1）に反映させるスクリプト
  window.addEventListener('DOMContentLoaded', () => {
    const heroTitleSpan = document.getElementById('page-hero-title');
    if (heroTitleSpan) {
      // トップページ（index.htmlなど）以外で、ページのh2タイトル等があればそれを取得して置き換える
      const mainHeading = document.querySelector('main h2');
      if (mainHeading && window.location.pathname !== '/' && !window.location.pathname.endsWith('index.html')) {
        heroTitleSpan.textContent = mainHeading.textContent;
      }
    }
  });
</script>
