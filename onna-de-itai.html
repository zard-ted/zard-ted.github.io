    <div class="article-text">５曲目は、女でいたいです

川島だりあさんの作詞作曲で、早くもZARD最後の坂井さん以外の作詞作品です
軽い出会いの彼と別れたけど、別れたばかりでまだ未練が断ち切れず、よりを戻したいという女心を描いた歌です

坂井さん作詞曲やないからあまり曲にコメントするつもりもないけど、エッチな曲です
ZARDは初期の頃にはエッチな曲が割と多いです

あ、女心って言ってますが、私は女心とか全くわからん単なるおっさんですｗ
え？このギャグ飽きた？ｗ

あ、ほんまに１日で終わったｗ</div>
